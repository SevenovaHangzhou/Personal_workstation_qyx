name: Build Evaluator Windows
on:
  push:
    branches: [codex/evaluator-manager-progress]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: evaluator-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      ORBIT_SKIP_OTA: '1'
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Run native Windows regression tests
        run: python scripts/test_windows_release.py
      - name: Build and verify administrator installer
        run: python scripts/build_windows.py --work-dir build/evaluator-windows --output artifacts
        env:
          ORBIT_APP_PROFILE: work
          ORBIT_EVALUATOR_BUILD: '1'
      - name: Include administrator guide
        run: Copy-Item docs/EVALUATOR_GUIDE.md artifacts/EVALUATOR_GUIDE.zh-CN.md
      - name: Upload Windows installer and portable package
        uses: actions/upload-artifact@v4
        with:
          name: evaluator-windows-x64-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload startup verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluator-windows-verification-${{ github.sha }}
          path: build/evaluator-windows/*.png
          if-no-files-found: ignore
          retention-days: 30
