name: Build ORBIT and LUMA
on:
  push:
    branches: [windows]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish (leave empty for a test build)
        required: false
        default: ""
        type: string
concurrency:
  group: orbit-release-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  linux:
    strategy:
      matrix:
        product: [work, study]
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-xinerama0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 fonts-noto-cjk
      - run: python -m pip install -r packaging/requirements-release.txt -r packaging/requirements-build.txt
      - run: python scripts/test_linux_release.py
      - run: python scripts/build_release.py --work-dir build/linux --output artifacts
        env:
          ORBIT_APP_PROFILE: ${{ matrix.product }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.product }}-release
          path: artifacts/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-${{ matrix.product }}-verification
          path: |
            build/linux/*.png
  windows-tests:
    runs-on: windows-2022
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Native Windows regression tests
        run: python scripts/test_windows_release.py
  windows:
    strategy:
      matrix:
        product: [work, study]
    runs-on: windows-2022
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Build portable app and per-user installer
        run: python scripts/build_windows.py --work-dir build/windows --output artifacts
        env:
          ORBIT_APP_PROFILE: ${{ matrix.product }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.product }}-release
          path: artifacts/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-${{ matrix.product }}-verification
          path: |
            build/windows/*.png
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')
    needs: [linux, windows-tests, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          path: artifacts
          merge-multiple: true
      - name: Verify tag and release assets
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from typedefine.TypeDefine import APP_VERSION
          assert os.environ['RELEASE_TAG']=='v'+APP_VERSION
          root=Path('artifacts')
          for name in ('manifest.json','windows-manifest.json','luma-manifest.json','luma-windows-manifest.json'):
              data=json.loads((root/name).read_text());assert data['version']==APP_VERSION
              assert data['app_id']==('com.sevenova.Luma' if name.startswith('luma') else 'com.sevenova.Orbit')
              for artifact in data['artifacts']:
                  file=root/artifact['file'];assert file.stat().st_size==artifact['bytes']
                  assert hashlib.sha256(file.read_bytes()).hexdigest()==artifact['sha256']
          PY
      - name: Publish verified Linux and Windows applications together
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" artifacts/* --verify-tag --title "星序 ORBIT · 知序 LUMA ${RELEASE_TAG}" --notes-file "release/${RELEASE_TAG#v}/RELEASE_NOTES.md"
