name: Build ORBIT, LUMA and Evaluator
on:
  push:
    branches: [windows]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish (leave empty for a test build)
        required: false
        default: ""
        type: string
concurrency:
  group: orbit-release-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-22.04
    outputs:
      evaluator: ${{ steps.sources.outputs.evaluator }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - id: sources
        name: Resolve fixed administrator source
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          from typedefine.TypeDefine import APP_VERSION
          pin=json.loads(Path('release',APP_VERSION,'sources.json').read_text())
          assert pin['version']==APP_VERSION
          commit=pin['evaluator_commit']
          assert re.fullmatch('[0-9a-f]{40}',commit)
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
              stream.write('evaluator='+commit+'\n')
          PY
  linux:
    needs: sources
    strategy:
      fail-fast: false
      matrix:
        product: [work, study, evaluator]
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.product == 'evaluator' && needs.sources.outputs.evaluator || (inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref) }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-xinerama0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 fonts-noto-cjk
      - run: python -m pip install -r packaging/requirements-release.txt -r packaging/requirements-build.txt
      - run: python scripts/test_linux_release.py
      - run: python scripts/build_release.py --work-dir build/linux --output artifacts
        env:
          ORBIT_APP_PROFILE: ${{ matrix.product == 'study' && 'study' || 'work' }}
          ORBIT_EVALUATOR_BUILD: ${{ matrix.product == 'evaluator' && '1' || '0' }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.product }}-release
          path: artifacts/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-${{ matrix.product }}-verification
          path: build/linux/*.png
  windows-tests:
    needs: sources
    strategy:
      fail-fast: false
      matrix:
        product: [work, evaluator]
    runs-on: windows-2022
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.product == 'evaluator' && needs.sources.outputs.evaluator || (inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref) }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Native Windows regression tests
        run: python scripts/test_windows_release.py
  windows:
    needs: sources
    strategy:
      fail-fast: false
      matrix:
        product: [work, study, evaluator]
    runs-on: windows-2022
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.product == 'evaluator' && needs.sources.outputs.evaluator || (inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref) }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Build portable app and per-user installer
        run: python scripts/build_windows.py --work-dir build/windows --output artifacts
        env:
          ORBIT_APP_PROFILE: ${{ matrix.product == 'study' && 'study' || 'work' }}
          ORBIT_EVALUATOR_BUILD: ${{ matrix.product == 'evaluator' && '1' || '0' }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.product }}-release
          path: artifacts/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-${{ matrix.product }}-verification
          path: build/windows/*.png
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')
    needs: [sources, linux, windows-tests, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      EVALUATOR_COMMIT: ${{ needs.sources.outputs.evaluator }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          path: artifacts
          merge-multiple: true
      - name: Verify source, version and all twelve application packages
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          from typedefine.TypeDefine import APP_VERSION
          assert os.environ['RELEASE_TAG']=='v'+APP_VERSION
          main_commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          Path('artifacts/release-build-sources.json').write_text(json.dumps({'version':APP_VERSION,'work_commit':main_commit,'study_commit':main_commit,'evaluator_commit':os.environ['EVALUATOR_COMMIT'],'workflow_commit':os.environ['GITHUB_SHA']},indent=2)+'\n')
          root=Path('artifacts')
          for product,prefix,app_id in [('work','','com.sevenova.Orbit'),('study','luma-','com.sevenova.Luma'),('evaluator','evaluator-','com.sevenova.OrbitEvaluator')]:
              for platform,base,sums_name in [('linux-x86_64','manifest.json','SHA256SUMS'),('windows-x86_64','windows-manifest.json','WINDOWS-SHA256SUMS')]:
                  data=json.loads((root/(prefix+base)).read_text(encoding='utf-8-sig'))
                  assert (data['version'],data['app_id'],data['product'],data['platform'])==(APP_VERSION,app_id,product,platform)
                  assert data['source_commit']==(os.environ['EVALUATOR_COMMIT'] if product=='evaluator' else main_commit)
                  assert data['user_data_included'] is False and data['codex_credentials_included'] is False
                  sums_file=('EVALUATOR-' if product=='evaluator' else 'LUMA-' if product=='study' else '')+sums_name
                  sums=dict((name,digest) for digest,name in (line.split() for line in (root/sums_file).read_text(encoding='utf-8-sig').splitlines()))
                  assert len(data['artifacts'])==2
                  assert set(sums)=={item['file'] for item in data['artifacts']}
                  for artifact in data['artifacts']:
                      file=root/artifact['file'];assert file.stat().st_size==artifact['bytes']
                      assert hashlib.sha256(file.read_bytes()).hexdigest()==artifact['sha256']==sums[file.name]
          PY
      - name: Include offline setup manuals
        run: |
          cp docs/LINEAR_GUIDE.md "artifacts/ORBIT-${RELEASE_TAG#v}-Linear-Guide.zh-CN.md"
          cp docs/COLLABORATION.md "artifacts/ORBIT-${RELEASE_TAG#v}-Collaboration-Guide.zh-CN.md"
          cp "release/${RELEASE_TAG#v}/EVALUATOR_GUIDE.zh-CN.md" "artifacts/EVALUATOR-${RELEASE_TAG#v}-Guide.zh-CN.md"
      - name: Publish verified Linux and Windows applications together
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" artifacts/* --verify-tag --title "星序 ORBIT · 知序 LUMA · Evaluator ${RELEASE_TAG}" --notes-file "release/${RELEASE_TAG#v}/RELEASE_NOTES.md"
