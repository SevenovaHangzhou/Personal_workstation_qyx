name: Build and publish ORBIT
on:
  push:
    branches: [windows]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-xinerama0 libxcb-cursor0 fonts-noto-cjk
      - run: python -m pip install -r packaging/requirements-release.txt -r packaging/requirements-build.txt
      - run: python -m unittest discover -s tests -v > linux-tests.log 2>&1
      - run: python scripts/build_release.py --work-dir build/linux --output artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: artifacts/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-verification
          path: |
            linux-tests.log
            build/linux/*.log
            build/linux/*.png
  windows:
    runs-on: windows-2022
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Native Windows regression tests
        run: python scripts/test_windows_release.py 2> windows-tests.log
      - name: Build portable app and per-user installer
        run: python scripts/build_windows.py --work-dir build/windows --output artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: artifacts/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-verification
          path: |
            windows-tests.log
            build/windows/*.log
            build/windows/*.png
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          path: artifacts
          merge-multiple: true
      - name: Verify tag and release assets
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from typedefine.TypeDefine import APP_VERSION
          assert os.environ['GITHUB_REF_NAME']=='v'+APP_VERSION
          root=Path('artifacts')
          for name in ('manifest.json','windows-manifest.json'):
              data=json.loads((root/name).read_text());assert data['version']==APP_VERSION
              for artifact in data['artifacts']:
                  file=root/artifact['file'];assert file.stat().st_size==artifact['bytes']
                  assert hashlib.sha256(file.read_bytes()).hexdigest()==artifact['sha256']
          PY
      - name: Publish verified Linux and Windows applications together
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --title "星序 ORBIT ${GITHUB_REF_NAME}" --notes-file "release/${GITHUB_REF_NAME#v}/RELEASE_NOTES.md"
